name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-north-1

      # Content-addressed assets get long cache; the HTML shell and service
      # worker revalidate — an immutable sw.js would freeze the PWA on its
      # current version forever.
      - name: Upload assets
        run: |
          # data/, thumbs/ and pdfs/ live only in S3 (published out-of-band by
          # `npm run publish-data` and the pdf upload) — never touch them here.
          aws s3 sync dist "s3://${{ vars.S3_BUCKET }}" \
            --delete \
            --exclude index.html --exclude "data/*" --exclude "thumbs/*" --exclude "pdfs/*" \
            --exclude sw.js --exclude manifest.webmanifest --exclude registerSW.js \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 cp dist/index.html "s3://${{ vars.S3_BUCKET }}/index.html" \
            --cache-control "public,max-age=60,must-revalidate"
          for f in sw.js manifest.webmanifest registerSW.js; do
            if [ -f "dist/$f" ]; then
              aws s3 cp "dist/$f" "s3://${{ vars.S3_BUCKET }}/$f" \
                --cache-control "public,max-age=0,must-revalidate"
            fi
          done

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/index.html" "/sw.js" "/manifest.webmanifest" "/registerSW.js"
