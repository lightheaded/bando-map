<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#1a1a1a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Bando Map</title>
  </head>
  <body>
    <div id="root"></div>
    <!--
      Test hook: ?rafshim drives requestAnimationFrame with setTimeout so the
      map loads in hidden/automated tabs (Chrome parks rAF there, and MapLibre
      never fires `load` without it). Inert in normal use.
    -->
    <script>
      if (new URLSearchParams(location.search).has('rafshim')) {
        window.requestAnimationFrame = (cb) => setTimeout(() => cb(performance.now()), 16)
        window.cancelAnimationFrame = (id) => clearTimeout(id)
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
